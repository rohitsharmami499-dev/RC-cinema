    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashInfo - Movies, Sports & Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
        }

        header {
            background: #131c38;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #eab308;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #eab308;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .search-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            max-width: 450px;
            margin: 0 auto 15px auto;
            position: relative;
        }

        .search-container input {
            width: 70%;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #ffffff;
            color: #000000;
            outline: none;
        }

        .search-container button {
            padding: 8px 14px;
            border-radius: 4px;
            border: none;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        .suggestions-box {
            position: absolute;
            top: 40px;
            left: 5%;
            width: 70%;
            background: #1e293b;
            border-radius: 4px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: left;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #334155;
        }

        .suggestion-item:hover {
            background: #334155;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }

        .nav-buttons button {
            background: #253354;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-buttons button.active {
            background: #eab308;
            color: #000000;
            font-weight: bold;
        }

        .sports-banner {
            background: #111a33;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px 15px;
            margin: 20px 15px;
            text-align: center;
        }

        .sports-banner h3 {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .sports-banner p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .sports-banner .btn-live {
            background: #00d2ff;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            font-size: 14px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .movie-card {
            background: #131c38;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .movie-info {
            padding: 8px;
        }

        .movie-info h3 {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-info p {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .game-card-small {
            background: #131c38;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }

        .game-card-small img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
        }

        .game-card-small p {
            font-size: 12px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ FlashInfo</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Movies or Web Series..." oninput="handleSearchInput(this.value)">
            <button onclick="performSearch()">Search</button>
            <div id="suggestionsBox" class="suggestions-box"></div>
        </div>
        <div class="nav-buttons">
            <button onclick="filterType('movie')">🎬 Movies</button>
            <button onclick="filterType('tv')">📺 Web Series</button>
            <button class="active" onclick="filterLanguage('te', this)">Telugu</button>
            <button onclick="filterLanguage('hi', this)">Hindi</button>
            <button onclick="filterLanguage('en', this)">English</button>
            <button onclick="filterLanguage('kn', this)">Kannada</button>
            <button onclick="showGamesSection()">🎮 Free Games</button>
        </div>
    </header>

    <div class="sports-banner">
        <h3>🏏 FlashInfo Sports: Live Cricket Updates</h3>
        <p>Get instant live scores, upcoming match schedules & latest news directly on Cricbuzz.</p>
        <a href="https://m.cricbuzz.com/cricket-match/live-scores" target="_blank" class="btn-live">View Live Scores & Updates 🚀</a>
    </div>

    <!-- Content Containers -->
    <div id="moviesContainer" class="movies-grid"></div>
    <div id="gamesContainer" style="display:none;"></div>

    <script>
        const API_KEY = '59973be85848763e326b1c3ef9461129';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t3/p/w500';

        let currentLang = 'te';
        let currentMediaType = 'movie';

        window.onload = () => {
            fetchContent(currentMediaType, currentLang);
        };

        // Fetch Movies & Series
        async function fetchContent(type = 'movie', lang = currentLang) {
            currentMediaType = type;
            
            const gamesCont = document.getElementById("gamesContainer");
            const moviesCont = document.getElementById("moviesContainer");
            
            if (gamesCont) gamesCont.style.display = "none";
            if (moviesCont) moviesCont.style.display = "grid";

            let endpoint = '';
            if (type === 'tv') {
                endpoint = `${BASE_URL}/discover/tv?api_key=${API_KEY}&with_original_language=${lang}&sort_by=popularity.desc&without_genres=10766,10763,10767`; 
            } else {
                endpoint = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_original_language=${lang}&sort_by=popularity.desc`;
            }

            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                displayItems(data.results, type);
            } catch (err) {
                if (moviesCont) moviesCont.innerHTML = '<p style="color:red; text-align:center; grid-column:1/-1;">Error loading content!</p>';
            }
        }

        function filterType(type) {
            fetchContent(type, currentLang);
        }

        function filterLanguage(lang, btn) {
            if (btn) {
                document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            currentLang = lang;
            fetchContent(currentMediaType, lang);
        }

        // Live Search Suggestions
        async function handleSearchInput(query) {
            const box = document.getElementById('suggestionsBox');
            if (!box) return;
            
            if (!query || query.trim().length < 2) {
                box.innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                
                const filtered = (data.results || []).filter(item => item.media_type === 'movie' || item.media_type === 'tv').slice(0, 5);
                
                box.innerHTML = '';
                filtered.forEach(item => {
                    const title = item.title || item.name;
                    const img = item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/40';
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `<img src="${img}" style="width:30px; height:40px; border-radius:4px;"> <span>${title} (${item.media_type === 'tv' ? 'Series' : 'Movie'})</span>`;
                    div.onclick = () => {
                        alert(`Selected: ${title}`);
                        box.innerHTML = '';
                    };
                    box.appendChild(div);
                });
            } catch(e) {
                box.innerHTML = '';
            }
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (query) {
                handleSearchInput(query);
            }
        }

        // Display Items
        function displayItems(items, type) {
            const container = document.getElementById('moviesContainer');
            if (!container) return;
            
            container.innerHTML = '';

            if (!items || items.length === 0) {
                container.innerHTML = '<p style="color:#fff; text-align:center; grid-column:1/-1;">No content found.</p>';
                return;
            }

            items.forEach(item => {
                const title = type === 'tv' ? item.name : item.title;
                const release = type === 'tv' ? item.first_air_date : item.release_date;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => alert(`Movie: ${title}`);

                card.innerHTML = `
                    <img src="${item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster'}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <p>⭐ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'} | 📅 ${release || 'N/A'}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Games Section
        const gameList = [
            { name: "2048 Classic", icon: "https://play-lh.googleusercontent.com/mO_k9F3S0N7Z3o8dI4dC0x0444.png", url: "https://play2048.co/" },
            { name: "Snake Game", icon: "https://via.placeholder.com/60?text=Snake", url: "https://playsnake.org/" },
            { name: "Tic Tac Toe", icon: "https://via.placeholder.com/60?text=TicTacToe", url: "https://playtictactoe.org/" }
        ];

        function showGamesSection() {
            const moviesCont = document.getElementById("moviesContainer");
            const gamesCont = document.getElementById("gamesContainer");
            
            if (moviesCont) moviesCont.style.display = "none";
            if (gamesCont) {
                gamesCont.style.display = "block";
                gamesCont.innerHTML = `
                    <h2 style="color:#fff; text-align:center; margin:15px 0;">🎮 Free Mobile Games</h2>
                    <div class="games-grid">
                        ${gameList.map(g => `
                            <div class="game-card-small" onclick="openGameModal('${g.url}')">
                                <img src="${g.icon}">
                                <p>${g.name}</p>
                            </div>
                        `).join('')}
                    </div>
                    <div id="gameModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000;">
                        <button onclick="closeGameModal()" style="position:absolute; top:10px; right:10px; background:red; color:#fff; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">❌ Close Game</button>
                        <iframe id="gameIframe" style="width:100%; height:100%; border:none;"></iframe>
                    </div>
                `;
            }
        }

        function openGameModal(url) {
            document.getElementById('gameIframe').src = url;
            document.getElementById('gameModal').style.display = 'block';
        }

        function closeGameModal() {
            document.getElementById('gameIframe').src = '';
            document.getElementById('gameModal').style.display = 'none';
        }
    </script>
</body>
</html>
