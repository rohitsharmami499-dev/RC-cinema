<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashInfo - Unlimited Movies & Web Series</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1329; color: #ffffff; min-height: 100vh; }
        
        header { background: #131c38; padding: 15px; text-align: center; border-bottom: 2px solid #eab308; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .logo { font-size: 28px; font-weight: 800; color: #eab308; margin-bottom: 12px; letter-spacing: 1px; }
        
        .search-container { display: flex; justify-content: center; gap: 8px; max-width: 480px; margin: 0 auto 15px auto; }
        .search-container input { width: 75%; padding: 11px 16px; border-radius: 20px; border: 1px solid #334155; outline: none; font-size: 14px; background: #0b1329; color: #fff; }
        .search-container button { padding: 11px 20px; border-radius: 20px; border: none; background: #eab308; color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .search-container button:hover { background: #facc15; }
        
        .nav-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 800px; margin: 0 auto; }
        .nav-buttons button { background: #253354; color: #ffffff; border: 1px solid #334155; padding: 8px 16px; border-radius: 18px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .nav-buttons button:hover { background: #334155; }
        .nav-buttons button.active { background: #eab308; color: #000000; border-color: #eab308; font-weight: bold; }

        .sports-banner { background: linear-gradient(135deg, #111a33 0%, #1e293b 100%); border: 1px solid #1e293b; border-radius: 12px; padding: 15px; margin: 15px; text-align: center; }
        .sports-banner h3 { color: #38bdf8; font-size: 15px; margin-bottom: 6px; }
        .sports-banner p { color: #94a3b8; font-size: 12px; margin-bottom: 12px; }
        .sports-banner .btn-live { background: #00d2ff; color: #000000; text-decoration: none; font-weight: bold; padding: 8px 18px; border-radius: 20px; display: inline-block; font-size: 13px; }

        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 15px; }
        .movie-card { background: #131c38; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #1e293b; display: flex; flex-direction: column; }
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
        .movie-card img { width: 100%; height: 210px; object-fit: cover; display: block; background-color: #1e293b; }
        .movie-info { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .movie-info h3 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff; margin-bottom: 4px; }
        .movie-info p { font-size: 11px; color: #94a3b8; }

        .load-more-box { text-align: center; margin: 25px 0 45px 0; }
        .btn-load-more { background: #eab308; color: #0f172a; border: none; padding: 12px 30px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3); }
        .btn-load-more:hover { background: #facc15; transform: scale(1.05); }

        /* Modal Popup */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.88); z-index: 2000; justify-content: center; align-items: center; padding: 15px; backdrop-filter: blur(4px); }
        .modal-content { background: #131c38; border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; padding: 20px; border: 1px solid #eab308; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .close-btn { position: absolute; top: 12px; right: 16px; font-size: 26px; color: #ffffff; cursor: pointer; }
        .modal-img { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .modal-title { font-size: 20px; color: #eab308; margin-bottom: 8px; }
        .modal-meta { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .modal-desc { font-size: 13px; line-height: 1.6; margin-bottom: 18px; color: #cbd5e1; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-action { display: block; text-align: center; padding: 11px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-trailer { background: #ff0000; color: #ffffff; }
        .btn-watch { background: #00d2ff; color: #000000; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ FlashInfo</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search any movie or web series...">
            <button onclick="performSearch()">Search</button>
        </div>
        <div class="nav-buttons">
            <button class="active" onclick="changeCategory('te', this)">Telugu</button>
            <button onclick="changeCategory('hi', this)">Hindi</button>
            <button onclick="changeCategory('en', this)">English</button>
            <button onclick="changeCategory('kn', this)">Kannada</button>
            <button onclick="changeCategory('movie', this)">🎬 Movies</button>
            <button onclick="changeCategory('tv', this)">📺 Web Series</button>
            <button onclick="changeCategory('marvel', this)">🦸 Marvel</button>
            <button onclick="changeCategory('dc', this)">🦇 DC Studio</button>
        </div>
    </header>

    <div class="sports-banner">
        <h3>🏏 FlashInfo Sports: Live Cricket Updates</h3>
        <p>Get instant live scores, match schedules & news directly on Cricbuzz.</p>
        <a href="https://m.cricbuzz.com/cricket-match/live-scores" target="_blank" class="btn-live">View Live Scores 🚀</a>
    </div>

    <div id="moviesContainer" class="movies-grid"></div>

    <div class="load-more-box">
        <button id="loadMoreBtn" class="btn-load-more" onclick="loadMoreMovies()">Load More Movies 🔄</button>
    </div>

    <!-- Movie Details Popup -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" class="modal-img" src="" alt="">
            <h2 id="modalTitle" class="modal-title"></h2>
            <div id="modalMeta" class="modal-meta"></div>
            <p id="modalDesc" class="modal-desc"></p>
            <div class="modal-actions">
                <a id="btnTrailer" class="btn-action btn-trailer" target="_blank">▶ Watch Trailer on YouTube</a>
                <a id="btnWatch" class="btn-action btn-watch" target="_blank">🔍 Where to Watch / Stream</a>
            </div>
        </div>
    </header>

    <script>
        const API_KEY = "841059f21a142833e034e30205f3b772";
        const BASE_URL = "https://api.themoviedb.org/3";
        const IMAGE_BASE = "https://image.tmdb.org/t3/p/w500";

        let currentCategory = 'te';
        let currentPage = 1;
        let isSearchMode = false;

        window.onload = () => {
            fetchMovies(currentCategory, currentPage);
        };

        function changeCategory(catKey, btn) {
            document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            currentCategory = catKey;
            currentPage = 1;
            isSearchMode = false;
            document.getElementById('moviesContainer').innerHTML = '';
            document.getElementById('loadMoreBtn').style.display = 'inline-block';
            
            fetchMovies(catKey, currentPage);
        }

        async function fetchMovies(category, page) {
            let url = "";

            if (category === 'te') {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_original_language=te&sort_by=popularity.desc&page=${page}`;
            } else if (category === 'hi') {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_original_language=hi&sort_by=popularity.desc&page=${page}`;
            } else if (category === 'en') {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_original_language=en&sort_by=popularity.desc&page=${page}`;
            } else if (category === 'kn') {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_original_language=kn&sort_by=popularity.desc&page=${page}`;
            } else if (category === 'marvel') {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_companies=420&sort_by=popularity.desc&page=${page}`;
            } else if (category === 'dc') {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_companies=128064|9993|429&sort_by=popularity.desc&page=${page}`;
            } else if (category === 'movie') {
                url = `${BASE_URL}/discover/movie?api_key=${API_KEY}&sort_by=popularity.desc&page=${page}`;
            } else if (category === 'tv') {
                url = `${BASE_URL}/discover/tv?api_key=${API_KEY}&sort_by=popularity.desc&page=${page}`;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Fetch Error");
                const data = await response.json();
                renderMovies(data.results);
            } catch (error) {
                fetchMoviesWithProxy(url);
            }
        }

        async function fetchMoviesWithProxy(originalUrl) {
            try {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(originalUrl)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();
                renderMovies(data.results);
            } catch (err) {
                console.error("Failed to load movies:", err);
            }
        }

        function renderMovies(movies) {
            const container = document.getElementById('moviesContainer');

            if (!movies || movies.length === 0) {
                if (currentPage === 1) container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No movies found.</p>';
                document.getElementById('loadMoreBtn').style.display = 'none';
                return;
            }

            movies.forEach(item => {
                const title = item.title || item.name || 'Untitled';
                const release = item.release_date || item.first_air_date || 'N/A';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                
                // Handling Fallback Posters
                const poster = item.poster_path 
                    ? (IMAGE_BASE + item.poster_path) 
                    : `https://via.placeholder.com/500x750/1e293b/ffffff?text=${encodeURIComponent(title)}`;
                
                const backdrop = item.backdrop_path ? (IMAGE_BASE + item.backdrop_path) : poster;

                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openModal(title, rating, release, item.overview, backdrop);
                card.innerHTML = `
                    <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/500x750/1e293b/ffffff?text=${encodeURIComponent(title)}'">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <p>⭐ ${rating} | 📅 ${release.split('-')[0] || 'N/A'}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function loadMoreMovies() {
            currentPage++;
            if (isSearchMode) {
                searchMoviesAPI(document.getElementById('searchInput').value, currentPage);
            } else {
                fetchMovies(currentCategory, currentPage);
            }
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            isSearchMode = true;
            currentPage = 1;
            document.getElementById('moviesContainer').innerHTML = '';
            document.getElementById('loadMoreBtn').style.display = 'inline-block';
            
            searchMoviesAPI(query, currentPage);
        }

        async function searchMoviesAPI(query, page) {
            const url = `${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}&page=${page}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                renderMovies(data.results);
            } catch (error) {
                fetchMoviesWithProxy(url);
            }
        }

        function openModal(title, rating, release, overview, imgUrl) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMeta').innerText = `⭐ Rating: ${rating} / 10 | 📅 Release: ${release}`;
            document.getElementById('modalDesc').innerText = overview || 'No description available for this title.';
            document.getElementById('modalImg').src = imgUrl;

            document.getElementById('btnTrailer').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(title + ' official trailer')}`;
            document.getElementById('btnWatch').href = `https://www.google.com/search?q=${encodeURIComponent('where to watch ' + title + ' streaming online')}`;

            document.getElementById('movieModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; }
        window.onclick = function(e) { if (e.target === document.getElementById('movieModal')) closeModal(); }
    </script>
</body>
</html>
