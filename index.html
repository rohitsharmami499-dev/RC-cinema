<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashInfo - Movies, Sports & Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
        }

        header {
            background: #131c38;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #eab308;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #eab308;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .search-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            max-width: 450px;
            margin: 0 auto 15px auto;
            position: relative;
        }

        .search-container input {
            width: 70%;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #ffffff;
            color: #000000;
            outline: none;
        }

        .search-container button {
            padding: 8px 14px;
            border-radius: 4px;
            border: none;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        .suggestions-box {
            position: absolute;
            top: 40px;
            left: 5%;
            width: 70%;
            background: #1e293b;
            border-radius: 4px;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: left;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #334155;
        }

        .suggestion-item:hover {
            background: #334155;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }

        .nav-buttons button {
            background: #253354;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-buttons button.active {
            background: #eab308;
            color: #000000;
            font-weight: bold;
        }

        .sports-banner {
            background: #111a33;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px 15px;
            margin: 20px 15px;
            text-align: center;
        }

        .sports-banner h3 {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .sports-banner p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .sports-banner .btn-live {
            background: #00d2ff;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            font-size: 14px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .movie-card {
            background: #131c38;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .movie-info {
            padding: 8px;
        }

        .movie-info h3 {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-info p {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* Embedded Games Container */
        .games-container {
            padding: 20px;
            text-align: center;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 5px;
            margin: 20px auto;
            width: 250px;
        }

        .cell {
            width: 80px;
            height: 80px;
            background: #1e293b;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ FlashInfo</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Movies or Web Series..." oninput="handleSearchInput(this.value)">
            <button onclick="performSearch()">Search</button>
            <div id="suggestionsBox" class="suggestions-box"></div>
        </div>
        <div class="nav-buttons">
            <button onclick="filterCategory('movie')">🎬 Movies</button>
            <button onclick="filterCategory('tv')">📺 Web Series</button>
            <button class="active" onclick="filterLanguage('te', this)">Telugu</button>
            <button onclick="filterLanguage('hi', this)">Hindi</button>
            <button onclick="filterLanguage('en', this)">English</button>
            <button onclick="filterLanguage('kn', this)">Kannada</button>
            <button onclick="showGamesSection()">🎮 Free Games</button>
        </div>
    </header>

    <div class="sports-banner">
        <h3>🏏 FlashInfo Sports: Live Cricket Updates</h3>
        <p>Get instant live scores, upcoming match schedules & latest news directly on Cricbuzz.</p>
        <a href="https://m.cricbuzz.com/cricket-match/live-scores" target="_blank" class="btn-live">View Live Scores & Updates 🚀</a>
    </div>

    <!-- Content Areas -->
    <div id="moviesContainer" class="movies-grid"></div>
    <div id="gamesContainer" class="games-container" style="display:none;"></div>

    <script>
        const API_KEY = '59973be85848763e326b1c3ef9461129';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t3/p/w500';

        let currentType = 'movie';
        let currentLang = 'te';

        window.onload = () => {
            fetchContent();
        };

        async function fetchContent() {
            document.getElementById("gamesContainer").style.display = "none";
            const moviesCont = document.getElementById("moviesContainer");
            moviesCont.style.display = "grid";
            moviesCont.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Loading...</p>';

            let url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&with_original_language=${currentLang}&sort_by=popularity.desc`;

            try {
                let res = await fetch(url);
                let data = await res.json();
                
                // Fallback if language API gives empty list
                if (!data.results || data.results.length === 0) {
                    url = `${BASE_URL}/${currentType}/popular?api_key=${API_KEY}`;
                    res = await fetch(url);
                    data = await res.json();
                }

                displayItems(data.results);
            } catch (err) {
                moviesCont.innerHTML = '<p style="color:red; text-align:center; grid-column:1/-1;">Error loading data!</p>';
            }
        }

        function filterCategory(type) {
            currentType = type;
            fetchContent();
        }

        function filterLanguage(lang, btn) {
            if (btn) {
                document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            currentLang = lang;
            fetchContent();
        }

        function displayItems(items) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No content found.</p>';
                return;
            }

            items.forEach(item => {
                const title = item.title || item.name;
                const release = item.release_date || item.first_air_date || 'N/A';
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster'}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <p>⭐ ${item.vote_average ? item.vote_average.toFixed(1) : 'N/A'} | 📅 ${release}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Live Search
        async function handleSearchInput(query) {
            const box = document.getElementById('suggestionsBox');
            if (!query || query.trim().length < 2) {
                box.innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                const filtered = (data.results || []).slice(0, 5);
                
                box.innerHTML = '';
                filtered.forEach(item => {
                    const title = item.title || item.name;
                    if (!title) return;
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `<span>${title}</span>`;
                    div.onclick = () => {
                        displayItems([item]);
                        box.innerHTML = '';
                    };
                    box.appendChild(div);
                });
            } catch(e) {
                box.innerHTML = '';
            }
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if(query) handleSearchInput(query);
        }

        // Tic Tac Toe Embedded Game
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "❌";

        function showGamesSection() {
            document.getElementById("moviesContainer").style.display = "none";
            const gamesCont = document.getElementById("gamesContainer");
            gamesCont.style.display = "block";
            
            gamesCont.innerHTML = `
                <h2>🎮 Tic Tac Toe Game</h2>
                <h3 id="gameStatus" style="margin-top:10px;">Turn: ${currentPlayer}</h3>
                <div class="game-board">
                    ${board.map((val, idx) => `<div class="cell" onclick="makeMove(${idx})">${val}</div>`).join('')}
                </div>
                <button onclick="resetGame()" style="padding:8px 16px; background:#eab308; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">Restart Game</button>
            `;
        }

        function makeMove(index) {
            if (board[index] !== "") return;
            board[index] = currentPlayer;
            currentPlayer = currentPlayer === "❌" ? "⭕" : "❌";
            showGamesSection();
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "❌";
            showGamesSection();
        }
    </script>
</body>
</html>
