<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashInfo - Unlimited Movies & Web Series</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1329; color: #ffffff; }
        header { background: #131c38; padding: 15px; text-align: center; border-bottom: 2px solid #eab308; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: 800; color: #eab308; margin-bottom: 12px; }
        
        .search-container { display: flex; justify-content: center; gap: 6px; max-width: 450px; margin: 0 auto 15px auto; }
        .search-container input { width: 75%; padding: 10px 14px; border-radius: 6px; border: 1px solid #334155; outline: none; font-size: 14px; color: #000; }
        .search-container button { padding: 10px 16px; border-radius: 6px; border: none; background: #eab308; color: #0f172a; font-weight: bold; cursor: pointer; }
        
        .nav-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 700px; margin: 0 auto; }
        .nav-buttons button { background: #253354; color: #ffffff; border: none; padding: 8px 16px; border-radius: 18px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .nav-buttons button.active { background: #eab308; color: #000000; }

        .sports-banner { background: #111a33; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; margin: 15px; text-align: center; }
        .sports-banner h3 { color: #38bdf8; font-size: 15px; margin-bottom: 6px; }
        .sports-banner p { color: #94a3b8; font-size: 12px; margin-bottom: 12px; }
        .sports-banner .btn-live { background: #00d2ff; color: #000000; text-decoration: none; font-weight: bold; padding: 8px 16px; border-radius: 6px; display: inline-block; font-size: 13px; }

        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 15px; }
        .movie-card { background: #131c38; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; border: 1px solid #1e293b; }
        .movie-card:hover { transform: translateY(-4px); }
        .movie-card img { width: 100%; height: 210px; object-fit: cover; display: block; }
        .movie-info { padding: 8px; }
        .movie-info h3 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff; }
        .movie-info p { font-size: 11px; color: #94a3b8; margin-top: 4px; }

        /* Modal Popup */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: #131c38; border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; padding: 20px; border: 1px solid #eab308; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; color: #ffffff; cursor: pointer; }
        .modal-img { width: 100%; height: 230px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .modal-title { font-size: 20px; color: #eab308; margin-bottom: 8px; }
        .modal-meta { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .modal-desc { font-size: 13px; line-height: 1.5; margin-bottom: 15px; color: #cbd5e1; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-action { display: block; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-trailer { background: #ff0000; color: #ffffff; }
        .btn-watch { background: #00d2ff; color: #000000; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ FlashInfo</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search any movie or web series...">
            <button onclick="performSearch()">Search</button>
        </div>
        <div class="nav-buttons">
            <button onclick="changeCategory('movie', this)">🎬 Movies</button>
            <button onclick="changeCategory('tv', this)">📺 Web Series</button>
            <button class="active" onclick="changeCategory('te', this)">Telugu</button>
            <button onclick="changeCategory('hi', this)">Hindi</button>
            <button onclick="changeCategory('en', this)">English</button>
            <button onclick="changeCategory('kn', this)">Kannada</button>
            <button onclick="changeCategory('marvel', this)">🦸 Marvel</button>
            <button onclick="changeCategory('dc', this)">🦇 DC Studio</button>
        </div>
    </header>

    <div class="sports-banner">
        <h3>🏏 FlashInfo Sports: Live Cricket Updates</h3>
        <p>Get instant live scores, match schedules & news directly on Cricbuzz.</p>
        <a href="https://m.cricbuzz.com/cricket-match/live-scores" target="_blank" class="btn-live">View Live Scores 🚀</a>
    </div>

    <div id="moviesContainer" class="movies-grid"></div>

    <!-- Movie Details Popup -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" class="modal-img" src="" alt="">
            <h2 id="modalTitle" class="modal-title"></h2>
            <div id="modalMeta" class="modal-meta"></div>
            <p id="modalDesc" class="modal-desc"></p>
            <div class="modal-actions">
                <a id="btnTrailer" class="btn-action btn-trailer" target="_blank">▶ Watch Trailer on YouTube</a>
                <a id="btnWatch" class="btn-action btn-watch" target="_blank">🔍 Where to Watch / Stream</a>
            </div>
        </div>
    </div>

    <script>
        // Offline Built-in Database to prevent API blocking
        const movieDatabase = {
            te: [

                { title: "RRR", year: "2022", rating: "7.8", poster: "https://m.media-amazon.com/images/M/MV5BODUwNDNjYzctODUxNy00ZTA2LWIyMDctM2JhMTU5M2E2OWUxXkEyXkFqcGc@._V1_SX300.jpg", desc: "A tale of two legendary revolutionaries and their journey far away from home." },
                { title: "Kalki 2898 AD", year: "2024", rating: "7.6", poster: "https://m.media-amazon.com/images/M/MV5BNmU4M2E3YmEtMDVjNS00NTNlLTlhMjAtMDI1NWZjMDIzNDY3XkEyXkFqcGc@._V1_SX300.jpg", desc: "A modern avatar of Vishnu, believed to have descended to earth to protect the world." },
                { title: "Devara: Part 1", year: "2024", rating: "7.1", poster: "https://m.media-amazon.com/images/M/MV5BYzA4ZDQ4NmItYzA3OS00YWI0LWI1YWMtZWY2NWJkYmJhOTk2XkEyXkFqcGc@._V1_SX300.jpg", desc: "An epic action saga set against the coastal lands of India." },
                { title: "Salaar: Ceasefire", year: "2023", rating: "6.5", poster: "https://m.media-amazon.com/images/M/MV5BMmU2NGNiM2YtM2JmNC00YjhmLTg1Y2ItYTVmNTM0N2NlY2I0XkEyXkFqcGc@._V1_SX300.jpg", desc: "A gang leader tries to keep a promise made to his dying friend." },
                { title: "Guntur Kaaram", year: "2024", rating: "6.2", poster: "https://m.media-amazon.com/images/M/MV5BZDQwZmE2MzYtN2E0NC00M2E1LTg3MDUtMDNlM2NmMWJhMzI3XkEyXkFqcGc@._V1_SX300.jpg", desc: "An action drama revolving around the king of the underworld in Guntur." }
            ],
            kn: [
                { title: "K.G.F: Chapter 2", year: "2022", rating: "8.3", poster: "https://m.media-amazon.com/images/M/MV5BM2M0YmIxNzItOWI4OS00MmE3LTk3ODctYzA3OWIzNWZhNWZhXkEyXkFqcGc@._V1_SX300.jpg", desc: "In the blood-soaked Kolar Gold Fields, Rocky's name strikes fear into his foes." },
                { title: "Kantara", year: "2022", rating: "8.2", poster: "https://m.media-amazon.com/images/M/MV5BNjQyNGI5OWEtZjI1Yy00NDVjLWE4MTAtM2FiTF00I2I3YzA4XkEyXkFqcGc@._V1_SX300.jpg", desc: "A conflict between village tradition and forestry officials." },
                { title: "777 Charlie", year: "2022", rating: "8.8", poster: "https://m.media-amazon.com/images/M/MV5BMDk2MTAxOTUtMGQyNC00N2Y4LWE1MmUtM2E2MDI1OWJiYmJhXkEyXkFqcGc@._V1_SX300.jpg", desc: "Dharma is stuck in a rut with his negative lifestyle, until a stray pup enters his life." },
                { title: "Vikrant Rona", year: "2022", rating: "7.0", poster: "https://m.media-amazon.com/images/M/MV5BZmNmMDlhNDktZTFlNy00NDQ0LWI0M2ItNmU3NWVmOWQ4YTkyXkEyXkFqcGc@._V1_SX300.jpg", desc: "A remote village starts witnessing mysterious events." }
            ],
            hi: [
                { title: "Jawan", year: "2023", rating: "7.0", poster: "https://m.media-amazon.com/images/M/MV5BMjA1NmY2YWEtMDRhNi00NTgwLWIzZmItZWI1ZjYzNGZhYThlXkEyXkFqcGc@._V1_SX300.jpg", desc: "A personal vendetta drives a man to rectify the wrongs in society." },
                { title: "Stree 2", year: "2024", rating: "7.4", poster: "https://m.media-amazon.com/images/M/MV5BZDU1NzI2YTMtMDk4OC00N2EzLThmYjAtN2NmMDY0MmQ3NTNhXkEyXkFqcGc@._V1_SX300.jpg", desc: "The town of Chanderi is haunted again by a headless entity." },
                { title: "Pathaan", year: "2023", rating: "5.9", poster: "https://m.media-amazon.com/images/M/MV5BM2QzM2JiNTMtOWM4NC00NmFlLTg2NWUtM2NmNDQ1YTIxOGU3XkEyXkFqcGc@._V1_SX300.jpg", desc: "An Indian agent battles against a mercenary group leader." }
            ],
            en: [
                { title: "Avengers: Endgame", year: "2019", rating: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BMTc5MDE2ODcwNV5BMl5BanBnXkFtZTgwMzI2NzIzNzM@._V1_SX300.jpg", desc: "After the devastating events of Infinity War, the universe is in ruins." },
                { title: "Oppenheimer", year: "2023", rating: "8.9", poster: "https://m.media-amazon.com/images/M/MV5BN2JkMDc5MGQtMmJiNi00OWVjLWE0ZjgtZDliMTZmMGI1GJhXkEyXkFqcGc@._V1_SX300.jpg", desc: "The story of American scientist J. Robert Oppenheimer and the atomic bomb." },
                { title: "Avatar: The Way of Water", year: "2022", rating: "7.6", poster: "https://m.media-amazon.com/images/M/MV5BYjhiNjBlODctMzE0NC00ODBhLWFmMGItYzViNWU4MmJiEFlXkEyXkFqcGc@._V1_SX300.jpg", desc: "Jake Sully lives with his newfound family formed on the home planet of Pandora." }
            ],
            marvel: [
                { title: "Deadpool & Wolverine", year: "2024", rating: "7.8", poster: "https://m.media-amazon.com/images/M/MV5BNzRiMjg0MzUtNTZmMi00M2M5LWEyYjMtMzA5MzUxM2YyNWJiXkEyXkFqcGc@._V1_SX300.jpg", desc: "Deadpool is offered a place in the Marvel Cinematic Universe." },
                { title: "Spider-Man: No Way Home", year: "2021", rating: "8.2", poster: "https://m.media-amazon.com/images/M/MV5BZWMyYzFjYTYtNTRjYi00OGExLWE2YzgtOGRmYjAxZTU3NzBiXkEyXkFqcGc@._V1_SX300.jpg", desc: "With Spider-Man's identity revealed, Peter asks Doctor Strange for help." }
            ],
            dc: [
                { title: "The Batman", year: "2022", rating: "7.8", poster: "https://m.media-amazon.com/images/M/MV5BMDdmMTBiNTYtMDIzNi00NGVlLWIzMDYtZTk3MTQ3NGQxU2FlXkEyXkFqcGc@._V1_SX300.jpg", desc: "When a sadistic serial killer begins murdering key political figures in Gotham." },
                { title: "Joker", year: "2019", rating: "8.4", poster: "https://m.media-amazon.com/images/M/MV5BNGVjNWI4ZGUtNzE0MS00YTJmLWE0ZDctN2ZiYTk2YmI3NTYyXkEyXkFqcGc@._V1_SX300.jpg", desc: "Arthur Fleck, a party clown, leads a downward spiral into revolution." }
            ],
            tv: [
                { title: "Stranger Things", year: "2016-", rating: "8.7", poster: "https://m.media-amazon.com/images/M/MV5BM2M1MmVhNDgtNmI0MS00ZDNmLThlOWUtNDJiN2ZkNzA3NzUxXkEyXkFqcGc@._V1_SX300.jpg", desc: "When a young boy vanishes, a small town uncovers a mystery involving secret experiments." },
                { title: "Panchayat", year: "2020-", rating: "8.9", poster: "https://m.media-amazon.com/images/M/MV5BMTI5M2MyZjEtNTdhYi00MDllLWI3NTktMTI2NzExM2RjMWI2XkEyXkFqcGc@._V1_SX300.jpg", desc: "A comedy-drama, which captures the journey of an engineering graduate." },
                { title: "The Family Man", year: "2019-", rating: "8.7", poster: "https://m.media-amazon.com/images/M/MV5BMmE1ODlhOTItNDlhMi00Y2ZhLWI4NTAtYTU3Y2M2MDlhNDhkXkEyXkFqcGc@._V1_SX300.jpg", desc: "A working man from the National Investigation Agency tries to protect his family." }
            ],
            movie: [
                { title: "Pushpa 2: The Rule", year: "2024", rating: "8.8", poster: "https://m.media-amazon.com/images/M/MV5BN2E1Mjg3NDItNGNhMi00MDJjLWI3NTktYmZhZDJlMmI4Nzg4XkEyXkFqcGc@._V1_SX300.jpg", desc: "Pushpa Raj continues to rule the red sandalwood smuggling market." },
                { title: "Kalki 2898 AD", year: "2024", rating: "7.6", poster: "https://m.media-amazon.com/images/M/MV5BNmU4M2E3YmEtMDVjNS00NTNlLTlhMjAtMDI1NWZjMDIzNDY3XkEyXkFqcGc@._V1_SX300.jpg", desc: "A modern avatar of Vishnu descended to protect the world." },
                { title: "Deadpool & Wolverine", year: "2024", rating: "7.8", poster: "https://m.media-amazon.com/images/M/MV5BNzRiMjg0MzUtNTZmMi00M2M5LWEyYjMtMzA5MzUxM2YyNWJiXkEyXkFqcGc@._V1_SX300.jpg", desc: "Deadpool is offered a place in the Marvel Cinematic Universe." }
            ]
        };

        window.onload = () => {
            renderMovies(movieDatabase['te']);
        };

        function changeCategory(catKey, btn) {
            document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            
            const movies = movieDatabase[catKey] || movieDatabase['te'];
            renderMovies(movies);
        }

        function renderMovies(movies) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';

            if(!movies || movies.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">No movies found.</p>';
                return;
            }

            movies.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openModal(item.title, item.rating, item.year, item.desc, item.poster);
                card.innerHTML = `
                    <img src="${item.poster}" alt="${item.title}" loading="lazy">
                    <div class="movie-info">
                        <h3>${item.title}</h3>
                        <p>⭐ ${item.rating} | 📅 ${item.year}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) return;

            let allMovies = [];
            Object.values(movieDatabase).forEach(list => allMovies.push(...list));

            const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query));
            renderMovies(filtered);
        }

        function openModal(title, rating, release, overview, imgUrl) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMeta').innerText = `⭐ Rating: ${rating} / 10 | 📅 Release: ${release}`;
            document.getElementById('modalDesc').innerText = overview;
            document.getElementById('modalImg').src = imgUrl;

            document.getElementById('btnTrailer').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(title + ' official trailer')}`;
            document.getElementById('btnWatch').href = `https://www.google.com/search?q=${encodeURIComponent('where to watch ' + title + ' streaming online')}`;

            document.getElementById('movieModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; }
        window.onclick = function(e) { if (e.target === document.getElementById('movieModal')) closeModal(); }
    </script>
</body>
</html>
