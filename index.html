<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashInfo - Movies, Sports & Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
        }

        header {
            background: #131c38;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #eab308;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #eab308;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .search-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            max-width: 450px;
            margin: 0 auto 15px auto;
        }

        .search-container input {
            width: 70%;
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #334155;
            background: #ffffff;
            color: #000000;
            outline: none;
        }

        .search-container button {
            padding: 8px 14px;
            border-radius: 4px;
            border: none;
            background: #e2e8f0;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }

        .nav-buttons button {
            background: #253354;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-buttons button.active {
            background: #eab308;
            color: #000000;
            font-weight: bold;
        }

        .sports-banner {
            background: #111a33;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px 15px;
            margin: 20px 15px;
            text-align: center;
        }

        .sports-banner h3 {
            color: #38bdf8;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .sports-banner p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .sports-banner .btn-live {
            background: #00d2ff;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
            font-size: 14px;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .movie-card {
            background: #131c38;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 10px;
        }

        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .movie-info {
            padding: 8px;
        }

        .movie-info h3 {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-info p {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }

        .games-section {
            padding: 20px;
            text-align: center;
        }

        .games-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .games-menu button {
            background: #00d2ff;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            gap: 5px;
            margin: 15px auto;
            width: 220px;
        }

        .cell {
            width: 70px;
            height: 70px;
            background: #1e293b;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ FlashInfo</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Movies or Web Series...">
            <button onclick="performSearch()">Search</button>
        </div>
        <div class="nav-buttons">
            <button onclick="filterCategory('movie')">🎬 Movies</button>
            <button onclick="filterCategory('tv')">📺 Web Series</button>
            <button class="active" onclick="filterLanguage('te', this)">Telugu</button>
            <button onclick="filterLanguage('hi', this)">Hindi</button>
            <button onclick="filterLanguage('en', this)">English</button>
            <button onclick="filterLanguage('kn', this)">Kannada</button>
            <button onclick="showGamesSection()">🎮 Free Games</button>
        </div>
    </header>

    <div class="sports-banner" id="sportsBanner">
        <h3>🏏 FlashInfo Sports: Live Cricket Updates</h3>
        <p>Get instant live scores, upcoming match schedules & latest news directly on Cricbuzz.</p>
        <a href="https://m.cricbuzz.com/cricket-match/live-scores" target="_blank" class="btn-live">View Live Scores & Updates 🚀</a>
    </div>

    <div id="moviesContainer" class="movies-grid"></div>
    <div id="gamesContainer" class="games-section" style="display:none;"></div>

    <script>
        // Sample Movies & Web Series Data (Fallback System)
        const mediaData = {
            te: [
                { title: "Kalki 2898 AD", rating: "8.5", date: "2024", img: "https://image.tmdb.org/t3/p/w500/1X64hN6gVlI0D9E0eT9lFp7uL0J.jpg" },
                { title: "Devara", rating: "8.1", date: "2024", img: "https://image.tmdb.org/t3/p/w500/A68nZ5mI6i5FzY2M8u2L8R3p0P.jpg" },
                { title: "Pushpa 2", rating: "8.9", date: "2024", img: "https://image.tmdb.org/t3/p/w500/A2nZ5mI6i5FzY2M8u2L8R3p0P.jpg" },
                { title: "Salaar", rating: "8.3", date: "2023", img: "https://image.tmdb.org/t3/p/w500/2L8R3p0P1X64hN6gVlI0D9E0eT.jpg" }
            ],
            hi: [
                { title: "Jawan", rating: "8.2", date: "2023", img: "https://image.tmdb.org/t3/p/w500/iA4iI9vL2Y3QzI2l7A8fE4r0M.jpg" },
                { title: "Stree 2", rating: "8.4", date: "2024", img: "https://image.tmdb.org/t3/p/w500/8R3p0P1X64hN6gVlI0D9E0eT9.jpg" },
                { title: "Pathaan", rating: "7.9", date: "2023", img: "https://image.tmdb.org/t3/p/w500/a2zX9M3N8P2L0K1J2H3G4F5E6.jpg" }
            ],
            en: [
                { title: "Avatar 2", rating: "8.8", date: "2022", img: "https://image.tmdb.org/t3/p/w500/t6HIqrRAOXZM23321A8fE4r0M.jpg" },
                { title: "Oppenheimer", rating: "8.9", date: "2023", img: "https://image.tmdb.org/t3/p/w500/8Gxv8K8A2a2C1B2d3E4f5G6h7.jpg" }
            ],
            kn: [
                { title: "KGF Chapter 2", rating: "9.0", date: "2022", img: "https://image.tmdb.org/t3/p/w500/q2Z9M3N8P2L0K1J2H3G4F5E6a.jpg" },
                { title: "Kantara", rating: "8.8", date: "2022", img: "https://image.tmdb.org/t3/p/w500/3Z9M3N8P2L0K1J2H3G4F5E6a1.jpg" }
            ]
        };

        let currentLang = 'te';

        window.onload = () => {
            renderMovies();
        };

        function renderMovies(list = null) {
            document.getElementById("gamesContainer").style.display = "none";
            document.getElementById("sportsBanner").style.display = "block";
            const container = document.getElementById("moviesContainer");
            container.style.display = "grid";
            container.innerHTML = '';

            const items = list || mediaData[currentLang] || mediaData['te'];

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${item.img}" onerror="this.src='https://via.placeholder.com/150x220?text=Movie'" alt="${item.title}">
                    <div class="movie-info">
                        <h3>${item.title}</h3>
                        <p>⭐ ${item.rating} | 📅 ${item.date}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(type) {
            renderMovies();
        }

        function filterLanguage(lang, btn) {
            if (btn) {
                document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            currentLang = lang;
            renderMovies();
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) return;
            const currentList = mediaData[currentLang] || mediaData['te'];
            const filtered = currentList.filter(m => m.title.toLowerCase().includes(query));
            renderMovies(filtered.length ? filtered : currentList);
        }

        // --- GAMES HUB ---
        function showGamesSection() {
            document.getElementById("moviesContainer").style.display = "none";
            document.getElementById("sportsBanner").style.display = "none";
            const gamesCont = document.getElementById("gamesContainer");
            gamesCont.style.display = "block";
            
            gamesCont.innerHTML = `
                <h2>🎮 Free Games Hub</h2>
                <p style="color:#94a3b8; margin-bottom:15px;">Game ఎంచుకుని ఆడండి!</p>
                <div class="games-menu">
                    <button onclick="loadTicTacToe()">❌ Tic Tac Toe</button>
                    <button onclick="loadRPS()">✂️ Rock Paper Scissors</button>
                    <button onclick="loadGuessNum()">🔢 Number Guessing</button>
                </div>
                <div id="activeGameArea"></div>
            `;
            loadTicTacToe();
        }

        // Tic Tac Toe Game
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "❌";

        function loadTicTacToe() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "❌";
            updateBoard();
        }

        function updateBoard() {
            const area = document.getElementById("activeGameArea");
            area.innerHTML = `
                <h3>Tic Tac Toe</h3>
                <p style="margin-top:5px;">Turn: ${currentPlayer}</p>
                <div class="game-board">
                    ${board.map((val, idx) => `<div class="cell" onclick="makeMove(${idx})">${val}</div>`).join('')}
                </div>
                <button onclick="loadTicTacToe()" style="padding:6px 12px; background:#eab308; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Restart Game</button>
            `;
        }

        function makeMove(index) {
            if (board[index] !== "") return;
            board[index] = currentPlayer;
            currentPlayer = currentPlayer === "❌" ? "⭕" : "❌";
            updateBoard();
        }

        // Rock Paper Scissors Game
        function loadRPS() {
            const area = document.getElementById("activeGameArea");
            area.innerHTML = `
                <h3>Rock Paper Scissors</h3>
                <p style="margin:10px 0;">మీ ఆప్షన్ ఎంచుకోండి:</p>
                <div style="display:flex; justify-content:center; gap:10px;">
                    <button onclick="playRPS('✊')" style="font-size:24px; padding:10px; cursor:pointer;">✊</button>
                    <button onclick="playRPS('✋')" style="font-size:24px; padding:10px; cursor:pointer;">✋</button>
                    <button onclick="playRPS('✌️')" style="font-size:24px; padding:10px; cursor:pointer;">✌️</button>
                </div>
                <div id="rpsResult" style="margin-top:15px; font-size:16px;"></div>
            `;
        }

        function playRPS(userChoice) {
            const choices = ['✊', '✋', '✌️'];
            const compChoice = choices[Math.floor(Math.random() * 3)];
            let res = '';
            if(userChoice === compChoice) res = "It's a Tie! 🤝";
            else if(
                (userChoice === '✊' && compChoice === '✌️') ||
                (userChoice === '✋' && compChoice === '✊') ||
                (userChoice === '✌️' && compChoice === '✋')
            ) res = "You Won! 🎉";
            else res = "Computer Won! 🤖";

            document.getElementById("rpsResult").innerHTML = `You: ${userChoice} vs Comp: ${compChoice}<br><b>${res}</b>`;
        }

        // Number Guessing Game
        let targetNum = Math.floor(Math.random() * 20) + 1;
        function loadGuessNum() {
            targetNum = Math.floor(Math.random() * 20) + 1;
            const area = document.getElementById("activeGameArea");
            area.innerHTML = `
                <h3>Guess Number (1 to 20)</h3>
                <div style="margin:15px 0;">
                    <input type="number" id="numInput" placeholder="Enter 1-20" style="padding:6px; width:100px; text-align:center;">
                    <button onclick="checkGuess()" style="padding:6px 12px; background:#eab308; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">Guess</button>
                </div>
                <div id="guessResult"></div>
            `;
        }

        function checkGuess() {
            const val = parseInt(document.getElementById("numInput").value);
            const res = document.getElementById("guessResult");
            if(!val) return;
            if(val === targetNum) res.innerHTML = "🎉 Correct! You Guessed it!";
            else if(val < targetNum) res.innerHTML = "📉 Too Low! Try again.";
            else res.innerHTML = "📈 Too High! Try again.";
        }
    </script>
</body>
</html>
