<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashInfo - Movies & Web Series</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b1329; color: #ffffff; }
        header { background: #131c38; padding: 15px; text-align: center; border-bottom: 2px solid #eab308; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 28px; font-weight: 800; color: #eab308; margin-bottom: 12px; }
        
        .search-container { display: flex; justify-content: center; gap: 6px; max-width: 450px; margin: 0 auto 15px auto; position: relative; }
        .search-container input { width: 75%; padding: 10px 14px; border-radius: 6px; border: 1px solid #334155; outline: none; font-size: 14px; color: #000; }
        .search-container button { padding: 10px 16px; border-radius: 6px; border: none; background: #eab308; color: #0f172a; font-weight: bold; cursor: pointer; }
        
        .suggestions-box { position: absolute; top: 45px; left: 5%; width: 75%; background: #1e293b; border-radius: 6px; max-height: 250px; overflow-y: auto; z-index: 1000; text-align: left; }
        .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #334155; font-size: 14px; }
        .suggestion-item:hover { background: #334155; }

        .nav-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 650px; margin: 0 auto; }
        .nav-buttons button { background: #253354; color: #ffffff; border: none; padding: 8px 16px; border-radius: 18px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .nav-buttons button.active { background: #eab308; color: #000000; }

        .sports-banner { background: #111a33; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; margin: 15px; text-align: center; }
        .sports-banner h3 { color: #38bdf8; font-size: 15px; margin-bottom: 6px; }
        .sports-banner p { color: #94a3b8; font-size: 12px; margin-bottom: 12px; }
        .sports-banner .btn-live { background: #00d2ff; color: #000000; text-decoration: none; font-weight: bold; padding: 8px 16px; border-radius: 6px; display: inline-block; font-size: 13px; }

        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; padding: 15px; }
        .movie-card { background: #131c38; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
        .movie-card:hover { transform: translateY(-4px); }
        .movie-card img { width: 100%; height: 190px; object-fit: cover; }
        .movie-info { padding: 8px; }
        .movie-info h3 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-info p { font-size: 11px; color: #94a3b8; margin-top: 4px; }

        /* Modal Popup */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 2000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: #131c38; border-radius: 12px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; padding: 20px; border: 1px solid #eab308; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; color: #ffffff; cursor: pointer; }
        .modal-img { width: 100%; height: 220px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .modal-title { font-size: 20px; color: #eab308; margin-bottom: 8px; }
        .modal-meta { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        .modal-desc { font-size: 13px; line-height: 1.5; margin-bottom: 15px; color: #cbd5e1; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .btn-action { display: block; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; }
        .btn-trailer { background: #ff0000; color: #ffffff; }
        .btn-watch { background: #00d2ff; color: #000000; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ FlashInfo</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search Movies or Web Series..." oninput="handleSearchInput(this.value)">
            <button onclick="performSearch()">Search</button>
            <div id="suggestionsBox" class="suggestions-box"></div>
        </div>
        <div class="nav-buttons">
            <button class="active" onclick="filterCategory('movie', this)">🎬 Movies</button>
            <button onclick="filterCategory('tv', this)">📺 Web Series</button>
            <button onclick="filterLanguage('te', this)">Telugu</button>
            <button onclick="filterLanguage('hi', this)">Hindi</button>
            <button onclick="filterLanguage('en', this)">English</button>
            <button onclick="filterLanguage('kn', this)">Kannada</button>
            <button onclick="filterSpecial('marvel', this)">🦸 Marvel</button>
            <button onclick="filterSpecial('dc', this)">🦇 DC Studio</button>
        </div>
    </header>

    <div class="sports-banner">
        <h3>🏏 FlashInfo Sports: Live Cricket Updates</h3>
        <p>Get instant live scores, match schedules & news directly on Cricbuzz.</p>
        <a href="https://m.cricbuzz.com/cricket-match/live-scores" target="_blank" class="btn-live">View Live Scores 🚀</a>
    </div>

    <div id="moviesContainer" class="movies-grid"></div>

    <!-- Movie Details Popup -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" class="modal-img" src="" alt="">
            <h2 id="modalTitle" class="modal-title"></h2>
            <div id="modalMeta" class="modal-meta"></div>
            <p id="modalDesc" class="modal-desc"></p>
            <div class="modal-actions">
                <a id="btnTrailer" class="btn-action btn-trailer" target="_blank">▶ Watch Trailer on YouTube</a>
                <a id="btnWatch" class="btn-action btn-watch" target="_blank">🔍 Search Streaming Platforms</a>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = '59973be85848763e326b1c3ef9461129';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t3/p/w500';

        let currentType = 'movie';
        let currentMode = 'category';
        let currentLang = 'te';

        // Backup List if API blocked on Github Pages
        const backupData = {
            te: [
                { title: "Kalki 2898 AD", vote_average: 8.5, release_date: "2024", poster_path: "/1X64hN6gVlI0D9E0eT9lFp7uL0J.jpg", backdrop_path: "/1X64hN6gVlI0D9E0eT9lFp7uL0J.jpg", overview: "A modern avatar of Vishnu descends to earth to protect the world from evil forces." },
                { title: "Devara", vote_average: 8.1, release_date: "2024", poster_path: "/A68nZ5mI6i5FzY2M8u2L8R3p0P.jpg", backdrop_path: "/A68nZ5mI6i5FzY2M8u2L8R3p0P.jpg", overview: "High voltage action saga set in coastal sea regions." },
                { title: "Pushpa 2: The Rule", vote_average: 8.9, release_date: "2024", poster_path: "/A2nZ5mI6i5FzY2M8u2L8R3p0P.jpg", backdrop_path: "/A2nZ5mI6i5FzY2M8u2L8R3p0P.jpg", overview: "Pushpa Raj continues to reign over the red sandalwood smuggling network." },
                { title: "Salaar: Part 1", vote_average: 8.3, release_date: "2023", poster_path: "/2L8R3p0P1X64hN6gVlI0D9E0eT.jpg", backdrop_path: "/2L8R3p0P1X64hN6gVlI0D9E0eT.jpg", overview: "A gang leader tries to keep a promise made to his dying friend." }
            ],
            hi: [
                { title: "Stree 2", vote_average: 8.4, release_date: "2024", poster_path: "/8R3p0P1X64hN6gVlI0D9E0eT9.jpg", backdrop_path: "/8R3p0P1X64hN6gVlI0D9E0eT9.jpg", overview: "The town of Chanderi is haunted by a headless monster." },
                { title: "Jawan", vote_average: 8.2, release_date: "2023", poster_path: "/iA4iI9vL2Y3QzI2l7A8fE4r0M.jpg", backdrop_path: "/iA4iI9vL2Y3QzI2l7A8fE4r0M.jpg", overview: "A high-octane action thriller highlighting social issues." }
            ],
            en: [
                { title: "Deadpool & Wolverine", vote_average: 8.7, release_date: "2024", poster_path: "/8Gxv8K8A2a2C1B2d3E4f5G6h7.jpg", backdrop_path: "/8Gxv8K8A2a2C1B2d3E4f5G6h7.jpg", overview: "Deadpool partners with Wolverine to protect the multiverse." },
                { title: "Oppenheimer", vote_average: 8.9, release_date: "2023", poster_path: "/t6HIqrRAOXZM23321A8fE4r0M.jpg", backdrop_path: "/t6HIqrRAOXZM23321A8fE4r0M.jpg", overview: "The story of J. Robert Oppenheimer's role in the Manhattan Project." }
            ],
            kn: [
                { title: "K.G.F: Chapter 2", vote_average: 8.9, release_date: "2022", poster_path: "/q2Z9M3N8P2L0K1J2H3G4F5E6a.jpg", backdrop_path: "/q2Z9M3N8P2L0K1J2H3G4F5E6a.jpg", overview: "Rocky takes over KGF and faces dangerous opponents." },
                { title: "Kantara", vote_average: 8.7, release_date: "2022", poster_path: "/3Z9M3N8P2L0K1J2H3G4F5E6a1.jpg", backdrop_path: "/3Z9M3N8P2L0K1J2H3G4F5E6a1.jpg", overview: "A human vs nature conflict rooted in traditional culture." }
            ]
        };

        window.onload = () => { fetchMovies(); };

        function updateActiveButton(btn) {
            if (btn) {
                document.querySelectorAll('.nav-buttons button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
        }

        async function fetchMovies(customUrl = null) {
            const container = document.getElementById("moviesContainer");
            container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Loading movies...</p>';

            let url = customUrl;
            if (!url) {
                if (currentMode === 'category') {
                    url = `${BASE_URL}/${currentType}/popular?api_key=${API_KEY}&page=1`;
                } else if (currentMode === 'language') {
                    url = `${BASE_URL}/discover/${currentType}?api_key=${API_KEY}&with_original_language=${currentLang}&sort_by=popularity.desc`;
                }
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data && data.results && data.results.length > 0) {
                    displayItems(data.results);
                } else {
                    displayItems(backupData[currentLang] || backupData['te']);
                }
            } catch (err) {
                displayItems(backupData[currentLang] || backupData['te']);
            }
        }

        function filterCategory(type, btn) {
            updateActiveButton(btn);
            currentType = type;
            currentMode = 'category';
            fetchMovies();
        }

        function filterLanguage(lang, btn) {
            updateActiveButton(btn);
            currentLang = lang;
            currentMode = 'language';
            fetchMovies();
        }

        function filterSpecial(company, btn) {
            updateActiveButton(btn);
            let companyId = company === 'marvel' ? '420' : '128064';
            fetchMovies(`${BASE_URL}/discover/movie?api_key=${API_KEY}&with_companies=${companyId}&sort_by=popularity.desc`);
        }

        function displayItems(items) {
            const container = document.getElementById('moviesContainer');
            container.innerHTML = '';

            items.forEach(item => {
                const title = item.title || item.name;
                const release = item.release_date || item.first_air_date || 'N/A';
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <img src="${item.poster_path ? (item.poster_path.startsWith('http') ? item.poster_path : IMG_URL + item.poster_path) : 'https://via.placeholder.com/500x750?text=Movie'}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <p>⭐ ${item.vote_average ? item.vote_average.toFixed(1) : '8.0'} | 📅 ${release}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Search Suggestions
        async function handleSearchInput(query) {
            const box = document.getElementById('suggestionsBox');
            if (!query || query.trim().length < 2) {
                box.innerHTML = '';
                return;
            }

            try {
                const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                const filtered = (data.results || []).slice(0, 5);
                
                box.innerHTML = '';
                filtered.forEach(item => {
                    const title = item.title || item.name;
                    if (!title) return;
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `<span>${title} (${item.media_type === 'tv' ? 'Series' : 'Movie'})</span>`;
                    div.onclick = () => {
                        box.innerHTML = '';
                        openModal(item);
                    };
                    box.appendChild(div);
                });
            } catch(e) {
                box.innerHTML = '';
            }
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (query) {
                document.getElementById('suggestionsBox').innerHTML = '';
                fetchMovies(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
            }
        }

        function openModal(item) {
            const title = item.title || item.name;
            const release = item.release_date || item.first_air_date || 'N/A';
            const overview = item.overview || 'No story details available.';
            const backdrop = item.backdrop_path || item.poster_path;

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMeta').innerText = `⭐ Rating: ${item.vote_average ? item.vote_average.toFixed(1) : '8.0'} / 10 | 📅 Release: ${release}`;
            document.getElementById('modalDesc').innerText = overview;
            document.getElementById('modalImg').src = backdrop ? (backdrop.startsWith('http') ? backdrop : IMG_URL + backdrop) : 'https://via.placeholder.com/500x280?text=No+Image';

            document.getElementById('btnTrailer').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(title + ' official trailer')}`;
            document.getElementById('btnWatch').href = `https://www.google.com/search?q=${encodeURIComponent('where to watch ' + title + ' streaming online')}`;

            document.getElementById('movieModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('movieModal').style.display = 'none'; }
        window.onclick = function(e) { if (e.target === document.getElementById('movieModal')) closeModal(); }
    </script>
</body>
</html>
